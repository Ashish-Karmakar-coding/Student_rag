version: "3.9"

services:
  # ── Backend (Hono on Node.js 20) ─────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: study-tutor-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/studytutor}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-study-tutor}
      APP_SECRET: ${APP_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    volumes:
      # Mount source for hot-reload in dev (tsx --watch)
      - ./apps/backend/src:/app/src:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - study-tutor-net

  # ── MongoDB (local mirror — use Atlas URI in production) ─────────────────────
  mongo:
    image: mongo:7
    container_name: study-tutor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - study-tutor-net

volumes:
  mongo-data:
    driver: local

networks:
  study-tutor-net:
    driver: bridge
